<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIE Catering – Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo">🍽️</div>
      <div>
        <h1>NIE Catering</h1>
        <span class="role-tag">Kitchen</span>
      </div>
    </div>
    <div class="header-user">
      <span class="user-name" id="userName"></span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main class="app-main">
    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-value" id="statBookings">0</div>
        <div class="stat-label">Bookings</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-value" id="statRevenue">0</div>
        <div class="stat-label">KES expected</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statCollected">0</div>
        <div class="stat-label">Collected</div>
      </div>
    </div>

    <!-- Post menu -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title"><span class="emoji">📝</span> Today's menu</h2>
        <span class="date-badge" id="todayDate"></span>
      </div>

      <div id="currentMenuPreview"></div>

      <div class="dish-inputs" id="dishInputs">
        <div class="dish-row">
          <input type="text" placeholder="Dish name, e.g. Beef stew" class="dish-input">
          <button type="button" class="remove-dish" onclick="removeDish(this)" title="Remove">×</button>
        </div>
      </div>
      <button type="button" class="add-dish-btn" onclick="addDishRow()">+ Add another dish</button>

      <div class="form-group" style="margin-bottom:14px">
        <label for="kitchenNote">Kitchen note (optional)</label>
        <textarea id="kitchenNote" placeholder="e.g. Service until 1:30 pm"></textarea>
      </div>

      <div class="action-row">
        <button class="book-btn" onclick="postMenu()">Publish menu</button>
        <button class="book-btn secondary" id="closeBtn" onclick="toggleClose()">Close booking</button>
      </div>
    </section>

    <!-- Bookings -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title"><span class="emoji">👥</span> Today's bookings</h2>
      </div>
      <div id="bookingsArea" class="bookings-list">
        <div class="empty-state small">
          <div class="empty-icon">📭</div>
          <p>No bookings yet today</p>
        </div>
      </div>
    </section>

    <!-- WhatsApp -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title"><span class="emoji">💬</span> WhatsApp</h2>
      </div>
      <div class="wa-section">
        <label style="font-size:13px;font-weight:600;color:var(--secondary);display:block;margin-bottom:8px">Message template</label>
        <textarea id="waMessage">Hi {name}! Your NIE Catering plate is ready: {items}. Please collect and pay KES 50. Thank you!</textarea>
        <button class="book-btn wa-btn" onclick="sendWhatsApp()">Open WhatsApp for all booked →</button>
      </div>
    </section>

    <!-- Admins -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title"><span class="emoji">🔑</span> Admins</h2>
      </div>
      <div id="adminsList"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    const user = getCurrentUser();
    if (!user || user.role !== 'admin') {
      window.location.href = 'index.html';
    }

    document.getElementById('userName').textContent = user.name;
    document.getElementById('todayDate').textContent = formatDate(getTodayDateStr());

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function addDishRow(value = '') {
      const row = document.createElement('div');
      row.className = 'dish-row';
      row.innerHTML = `
        <input type="text" placeholder="Dish name" class="dish-input" value="${value.replace(/"/g, '&quot;')}">
        <button type="button" class="remove-dish" onclick="removeDish(this)" title="Remove">×</button>`;
      document.getElementById('dishInputs').appendChild(row);
    }

    function removeDish(btn) {
      const rows = document.querySelectorAll('#dishInputs .dish-row');
      if (rows.length <= 1) {
        rows[0].querySelector('input').value = '';
        return;
      }
      btn.closest('.dish-row').remove();
    }

    function postMenu() {
      const inputs = document.querySelectorAll('#dishInputs .dish-input');
      const items = [...inputs].map(i => i.value.trim()).filter(Boolean);
      if (items.length === 0) {
        showToast('Add at least one dish');
        return;
      }
      const note = document.getElementById('kitchenNote').value.trim();
      const date = getTodayDateStr();
      const menus = JSON.parse(localStorage.getItem('menus') || '{}');
      const prev = menus[date] || {};
      menus[date] = { items, note, closed: prev.closed || false, postedAt: new Date().toISOString() };
      localStorage.setItem('menus', JSON.stringify(menus));
      showToast('Menu published ✓');
      refreshAll();
    }

    function toggleClose() {
      const date = getTodayDateStr();
      const menus = JSON.parse(localStorage.getItem('menus') || '{}');
      if (!menus[date]) {
        showToast('Publish a menu first');
        return;
      }
      menus[date].closed = !menus[date].closed;
      localStorage.setItem('menus', JSON.stringify(menus));
      showToast(menus[date].closed ? 'Booking closed' : 'Booking reopened');
      refreshAll();
    }

    function loadCurrentMenu() {
      const menu = getTodayMenu();
      const preview = document.getElementById('currentMenuPreview');
      const closeBtn = document.getElementById('closeBtn');

      if (!menu) {
        preview.innerHTML = `
          <div class="status-banner info" style="margin-bottom:14px">
            <span class="icon">ℹ️</span>
            <div>No menu published yet. Add dishes below and publish.</div>
          </div>`;
        closeBtn.textContent = 'Close booking';
        return;
      }

      preview.innerHTML = `
        <div class="status-banner ${menu.closed ? 'warning' : 'success'}" style="margin-bottom:14px">
          <span class="icon">${menu.closed ? '🔒' : '✅'}</span>
          <div>
            <strong>${menu.closed ? 'Booking closed' : 'Menu is live'}</strong>
            · ${menu.items.length} dish${menu.items.length !== 1 ? 'es' : ''}
            ${menu.note ? `<br><em style="opacity:0.85">${menu.note}</em>` : ''}
          </div>
        </div>
        <div class="menu-list" style="margin-bottom:14px">
          ${menu.items.map(i => `<div class="menu-item"><span class="item-name">${i}</span></div>`).join('')}
        </div>`;

      closeBtn.textContent = menu.closed ? 'Reopen booking' : 'Close booking';

      // Prefill inputs
      const container = document.getElementById('dishInputs');
      container.innerHTML = '';
      menu.items.forEach(item => addDishRow(item));
      if (menu.items.length === 0) addDishRow();
      document.getElementById('kitchenNote').value = menu.note || '';
    }

    function loadStats() {
      const date = getTodayDateStr();
      const bookings = getBookings().filter(b => b.date === date);
      const collected = bookings.filter(b => b.collected).length;
      document.getElementById('statBookings').textContent = bookings.length;
      document.getElementById('statRevenue').textContent = bookings.length * 50;
      document.getElementById('statCollected').textContent = collected;
    }

    function loadBookings() {
      const date = getTodayDateStr();
      const bookings = getBookings()
        .filter(b => b.date === date)
        .sort((a, b) => (a.collected === b.collected ? 0 : a.collected ? 1 : -1));
      const area = document.getElementById('bookingsArea');

      if (bookings.length === 0) {
        area.innerHTML = `
          <div class="empty-state small">
            <div class="empty-icon">📭</div>
            <p>No bookings yet today</p>
          </div>`;
        return;
      }

      area.innerHTML = bookings.map((b, i) => `
        <div class="booking-card">
          <div class="booking-meta">
            <span class="booking-name">${b.studentName}</span>
            <button class="collect-btn ${b.collected ? 'done' : ''}"
              onclick="markCollected('${b.studentPhone}')"
              ${b.collected ? 'disabled' : ''}>
              ${b.collected ? '✓ Collected' : 'Mark collected'}
            </button>
          </div>
          <div class="booking-items">${b.items.join(' · ')}</div>
          <div class="booking-phone">📞 ${b.studentPhone}</div>
          ${b.note ? `<div class="note-box">${b.note}</div>` : ''}
        </div>
      `).join('');
    }

    function markCollected(phone) {
      const date = getTodayDateStr();
      let bookings = getBookings();
      const b = bookings.find(x => x.studentPhone === phone && x.date === date);
      if (!b) return;
      b.collected = true;
      localStorage.setItem('bookings', JSON.stringify(bookings));
      showToast('Marked collected ✓');
      loadStats();
      loadBookings();
    }

    function sendWhatsApp() {
      const date = getTodayDateStr();
      const bookings = getBookings().filter(b => b.date === date);
      if (bookings.length === 0) {
        showToast('No bookings today');
        return;
      }
      const template = document.getElementById('waMessage').value;
      bookings.forEach((b, i) => {
        setTimeout(() => {
          let msg = template
            .replace(/\{name\}/g, b.studentName)
            .replace(/\{items\}/g, b.items.join(', '));
          let phone = b.studentPhone.replace(/\s+/g, '').replace(/^0/, '254');
          if (!phone.startsWith('254')) phone = '254' + phone;
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }, i * 700);
      });
      showToast(`Opening WhatsApp for ${bookings.length} student(s)`);
    }

    function loadAdmins() {
      const admins = JSON.parse(localStorage.getItem('admins') || '[]');
      const container = document.getElementById('adminsList');
      if (admins.length === 0) {
        container.innerHTML = '<p class="empty-state small">No admins registered yet.</p>';
        return;
      }
      container.innerHTML = admins.map(a => `
        <div class="admin-card ${a.phone === user.phone ? 'current-admin' : ''}">
          <div class="admin-info">
            <strong>${a.name}</strong>
            <span>📞 ${a.phone}</span>
          </div>
          ${a.phone === user.phone ? '<span class="you-badge">You</span>' : ''}
        </div>
      `).join('');
    }

    function refreshAll() {
      loadCurrentMenu();
      loadStats();
      loadBookings();
      loadAdmins();
    }

    // Ensure at least one dish row
    if (document.querySelectorAll('#dishInputs .dish-row').length === 0) {
      addDishRow();
    }
    refreshAll();
  </script>
</body>
</html>
